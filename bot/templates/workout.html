<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#09090b" />
  <title>Heracles — Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.0/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    html { scroll-behavior: smooth; }
  </style>
</head>

<body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased">

  <!-- Sin token -->
  <div id="no-token" class="hidden min-h-screen flex items-center justify-center p-6">
    <div class="max-w-xs w-full text-center space-y-5">
      <div class="text-6xl">🏛️</div>
      <h1 class="text-2xl font-bold">Heracles</h1>
      <p class="text-zinc-400 text-sm">Pide tu enlace personal al bot:</p>
      <div class="bg-zinc-900 rounded-xl px-4 py-3 font-mono text-indigo-400 text-sm border border-zinc-800">/webapp</div>
    </div>
  </div>

  <!-- App -->
  <div x-data="workoutApp()" x-init="init()" x-cloak class="max-w-md mx-auto min-h-screen flex flex-col">

    <!-- Header -->
    <header class="px-4 pt-5 pb-3 flex items-start justify-between flex-shrink-0">
      <div>
        <h1 class="text-base font-bold text-zinc-100 tracking-tight">🏛️ Heracles</h1>
        <p class="text-[11px] text-zinc-600 mt-0.5 capitalize" x-text="todayDate()"></p>
      </div>
      <div class="text-right" x-show="userName">
        <p class="text-sm font-semibold text-zinc-200" x-text="userName"></p>
        <p class="text-[11px] text-zinc-500 max-w-[160px] truncate" x-text="goal"></p>
      </div>
    </header>

    <!-- Loading -->
    <div x-show="loading" class="flex-1 flex items-center justify-center">
      <div class="text-zinc-600 text-sm animate-pulse">Cargando sesión...</div>
    </div>

    <!-- ── DÍA DE DESCANSO ──────────────────────────────── -->
    <div x-show="!loading && plan && plan.is_rest_day" class="flex-1 flex items-center justify-center px-6">
      <div class="text-center space-y-5">
        <div class="text-6xl">🌙</div>
        <div>
          <p class="text-xl font-bold text-zinc-200 capitalize" x-text="plan?.today_day + ' — día de descanso'"></p>
          <p class="text-zinc-500 text-sm mt-1">El descanso es parte del entrenamiento.</p>
        </div>
        <template x-if="plan?.next_training_day">
          <div class="bg-zinc-900 border border-zinc-800 rounded-2xl px-5 py-4">
            <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest mb-1">Próximo entrenamiento</p>
            <p class="text-zinc-200 font-semibold capitalize" x-text="plan.next_training_day"></p>
          </div>
        </template>
      </div>
    </div>

    <!-- ── SESIÓN COMPLETADA ────────────────────────────── -->
    <div x-show="!loading && sessionComplete" class="flex-1 flex flex-col px-4 pt-6 pb-8 space-y-5">
      <div class="text-center">
        <div class="text-5xl mb-2" x-text="sessionWasAlreadyDone ? '✅' : '🏆'"></div>
        <p class="text-xl font-bold text-emerald-400"
           x-text="sessionWasAlreadyDone ? 'Ya completaste tu sesión de hoy' : '¡Sesión completada!'"></p>
        <p class="text-zinc-500 text-sm mt-1" x-text="plan?.day_name"></p>
      </div>

      <!-- Resumen por ejercicio -->
      <div class="w-full space-y-3">
        <template x-for="group in sessionGrouped" :key="group.exercise">
          <div class="bg-zinc-900 rounded-xl p-3 border border-zinc-800">
            <p class="text-xs font-semibold text-zinc-300 mb-1.5" x-text="group.exercise"></p>
            <div class="space-y-1">
              <template x-for="(set, i) in group.sets" :key="set.id">
                <div class="flex items-center gap-2 text-xs">
                  <span class="text-zinc-700 font-mono w-4" x-text="'S'+(i+1)"></span>
                  <span class="text-zinc-300 flex-1">
                    <span x-text="set.weight_kg === 0 ? 'PC' : set.weight_kg + 'kg'"></span>
                    <span class="text-zinc-600"> × </span>
                    <span x-text="set.reps"></span>
                  </span>
                  <span class="px-1.5 py-0.5 rounded text-[10px] font-semibold" :class="rirBadgeColor(set.rir)"
                        x-text="set.rir !== null ? 'RIR '+set.rir : ''"></span>
                </div>
              </template>
            </div>
          </div>
        </template>
      </div>
      <p class="text-zinc-600 text-xs text-center" x-text="session.length + ' series registradas'"></p>

      <!-- Progresión sugerida para la próxima sesión -->
      <div class="w-full">
        <!-- Calculando -->
        <div x-show="progressionLoading" class="text-center py-4">
          <p class="text-zinc-500 text-xs animate-pulse">Calculando progresión para la próxima sesión...</p>
        </div>

        <!-- Sugerencias disponibles -->
        <template x-if="progression && progression.length > 0">
          <div class="bg-zinc-900 rounded-2xl border border-indigo-900/50 overflow-hidden">
            <div class="px-4 py-3 border-b border-zinc-800">
              <p class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest">Próxima sesión — Carga sugerida</p>
            </div>
            <div class="divide-y divide-zinc-800">
              <template x-for="item in progression" :key="item.exercise">
                <div class="px-4 py-2.5 flex items-center gap-3">
                  <div class="flex-1 min-w-0">
                    <p class="text-xs font-semibold text-zinc-200 truncate" x-text="item.exercise"></p>
                    <p class="text-[10px] text-zinc-500 mt-0.5 leading-snug" x-text="item.basis"></p>
                  </div>
                  <div class="flex-shrink-0 text-right">
                    <span class="text-sm font-bold"
                          :class="item.next_weight > 0 ? 'text-indigo-400' : 'text-zinc-500'"
                          x-text="item.next_weight === 0 ? 'PC' : item.next_weight + ' kg'"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Error al calcular -->
        <template x-if="progressionError">
          <p class="text-zinc-600 text-xs text-center" x-text="progressionError"></p>
        </template>
      </div>
    </div>

    <!-- ── ENTRENAMIENTO ACTIVO ────────────────────────── -->
    <div x-show="!loading && plan && !plan.is_rest_day && !sessionComplete" class="flex-1 flex flex-col px-4 space-y-3 pb-6">

      <!-- Override banner -->
      <template x-if="plan?.override">
        <div class="bg-amber-950/50 border border-amber-800/50 rounded-xl px-3 py-2.5 flex gap-2">
          <span class="text-amber-400 flex-shrink-0">⚠️</span>
          <div class="min-w-0">
            <p class="text-amber-300 text-xs font-semibold">Ajuste activo para hoy</p>
            <p class="text-amber-400/80 text-[11px] leading-snug mt-0.5" x-text="plan.override.modification"></p>
          </div>
        </div>
      </template>

      <!-- Nombre del bloque + progreso -->
      <div>
        <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest" x-text="plan?.day_name"></p>
        <div class="mt-2 flex items-center gap-3">
          <!-- Barra de progreso (circuito en ámbar, normal en índigo/esmeralda) -->
          <div class="flex-1 flex gap-1">
            <template x-for="(ex, i) in (plan?.exercises || [])" :key="i">
              <div class="flex-1 h-1.5 rounded-full transition-all duration-300"
                   :class="ex.is_circuit
                     ? (i < currentExIdx ? 'bg-amber-700' : i === currentExIdx ? 'bg-amber-400' : 'bg-zinc-800')
                     : (i < currentExIdx ? 'bg-emerald-600' : i === currentExIdx ? 'bg-indigo-500' : 'bg-zinc-800')">
              </div>
            </template>
          </div>
          <span class="text-[11px] text-zinc-500 flex-shrink-0"
                x-text="(currentExIdx+1) + '/' + (plan?.exercises?.length || 0)"></span>
        </div>
      </div>

      <!-- Card ejercicio actual -->
      <div class="bg-zinc-900 rounded-2xl p-4 border border-zinc-800 space-y-4">

        <!-- Badge circuito -->
        <template x-if="isCircuitExercise">
          <div class="flex items-center gap-2 -mb-1">
            <span class="text-[10px] font-bold text-amber-500 uppercase tracking-widest">
              🔄 Circuito —
              <span x-text="'Ronda ' + circuitRound + ' / ' + currentExercise?.circuit_rounds"></span>
            </span>
          </div>
        </template>

        <!-- Nombre y nota -->
        <div>
          <p class="text-base font-bold text-zinc-100 leading-snug" x-text="currentExercise?.name"></p>
          <template x-if="currentExercise?.note">
            <p class="text-[11px] text-zinc-500 italic mt-1 leading-snug" x-text="currentExercise.note"></p>
          </template>
          <!-- Mini-mapa de ejercicios del circuito -->
          <template x-if="isCircuitExercise">
            <div class="flex gap-1 mt-2">
              <template x-for="(cex, ci) in circuitExercisesFromPlan" :key="ci">
                <div class="flex-1">
                  <div class="h-1 rounded-full mb-0.5 transition-all duration-300"
                       :class="ci < currentExercise.circuit_position ? 'bg-amber-700'
                             : ci === currentExercise.circuit_position ? 'bg-amber-400'
                             : 'bg-zinc-700'"></div>
                  <p class="text-[9px] text-zinc-600 truncate text-center leading-tight"
                     x-text="cex.name.split(' ')[0]"></p>
                </div>
              </template>
            </div>
          </template>
          <!-- Objetivo + estado -->
          <div class="flex items-center gap-2 mt-2">
            <span class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest">Objetivo</span>
            <!-- Objetivo normal -->
            <template x-if="!isCircuitExercise">
              <span class="text-xs text-indigo-400 font-semibold"
                    x-text="currentExercise?.target_sets + ' series × ' + currentExercise?.target_reps + ' reps'"></span>
            </template>
            <!-- Objetivo circuito -->
            <template x-if="isCircuitExercise">
              <span class="text-xs text-amber-400 font-semibold"
                    x-text="currentExercise?.circuit_rounds + ' rondas × ' + currentExercise?.target_reps + ' reps'"></span>
            </template>
            <div class="flex-1"></div>
            <!-- Badge estado normal -->
            <template x-if="!isCircuitExercise">
              <span class="px-2 py-0.5 text-xs font-bold rounded-lg border transition-colors duration-300"
                    :class="targetMet ? 'bg-emerald-950 text-emerald-400 border-emerald-900' : 'bg-indigo-950 text-indigo-400 border-indigo-900'"
                    x-text="targetMet ? '✅ ' + currentExercise?.target_sets + '/' + currentExercise?.target_sets : 'Serie ' + (setsCompleted + 1) + ' de ' + currentExercise?.target_sets"></span>
            </template>
            <!-- Badge estado circuito -->
            <template x-if="isCircuitExercise">
              <span class="px-2 py-0.5 text-xs font-bold rounded-lg border transition-colors duration-300"
                    :class="targetMet ? 'bg-emerald-950 text-emerald-400 border-emerald-900' : 'bg-amber-950 text-amber-400 border-amber-900'"
                    x-text="targetMet ? '✅ Ronda ' + circuitRound + ' lista' : 'Ronda ' + circuitRound + ' / ' + currentExercise?.circuit_rounds"></span>
            </template>
          </div>
        </div>

        <!-- Peso + Reps -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Peso (kg)</label>
            <div class="mt-1.5 flex gap-1 items-center">
              <button @click="weight = Math.max(0, (parseFloat(weight)||0) - 2.5).toString()"
                      class="w-10 h-11 flex-shrink-0 bg-zinc-800 rounded-xl text-zinc-400 text-xl font-bold hover:bg-zinc-700 active:scale-95 transition-all">−</button>
              <input x-model="weight" type="number" min="0" step="0.5" placeholder="0"
                     class="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-2 py-2.5 text-center text-sm font-bold text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
              <button @click="weight = ((parseFloat(weight)||0) + 2.5).toFixed(1)"
                      class="w-10 h-11 flex-shrink-0 bg-zinc-800 rounded-xl text-zinc-400 text-xl font-bold hover:bg-zinc-700 active:scale-95 transition-all">+</button>
            </div>
            <p class="text-[10px] mt-1 text-center"
               :class="currentExercise?.suggested_weight > 0 ? 'text-indigo-400' : 'text-zinc-700'"
               x-text="currentExercise?.suggested_weight > 0 ? ('↑ ' + currentExercise.suggested_weight + ' kg sugerido') : '0 = peso corporal'"></p>
          </div>
          <div>
            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">Reps</label>
            <div class="mt-1.5 flex gap-1 items-center">
              <button @click="reps = Math.max(1, (parseInt(reps)||0) - 1).toString()"
                      class="w-10 h-11 flex-shrink-0 bg-zinc-800 rounded-xl text-zinc-400 text-xl font-bold hover:bg-zinc-700 active:scale-95 transition-all">−</button>
              <input x-model="reps" type="number" min="1" placeholder="0"
                     class="flex-1 min-w-0 bg-zinc-800 border border-zinc-700 rounded-xl px-2 py-2.5 text-center text-sm font-bold text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"/>
              <button @click="reps = ((parseInt(reps)||0) + 1).toString()"
                      class="w-10 h-11 flex-shrink-0 bg-zinc-800 rounded-xl text-zinc-400 text-xl font-bold hover:bg-zinc-700 active:scale-95 transition-all">+</button>
            </div>
            <p class="text-[10px] mt-1 text-center"
               :class="currentExercise?.suggested_reps ? 'text-indigo-400' : 'text-zinc-700'"
               x-text="currentExercise?.suggested_reps ? ('↑ ' + currentExercise.suggested_reps + ' reps sugerido') : ''"></p>
          </div>
        </div>

        <!-- RIR -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="text-[10px] font-bold text-zinc-500 uppercase tracking-widest">RIR — Esfuerzo</label>
            <span class="text-[11px] text-zinc-500" x-text="rirLabel(rir)"></span>
          </div>
          <div class="flex gap-1.5">
            <template x-for="n in [0,1,2,3,4,5]" :key="n">
              <button @click="rir = n"
                      class="flex-1 h-10 rounded-xl text-sm font-bold transition-all active:scale-95"
                      :class="rir === n ? rirActiveColor(n) : 'bg-zinc-800 text-zinc-600 hover:text-zinc-300'"
                      x-text="n"></button>
            </template>
          </div>
          <div class="flex justify-between mt-1">
            <span class="text-[9px] text-rose-600 font-medium">Fallo</span>
            <span class="text-[9px] text-emerald-600 font-medium">Fácil</span>
          </div>
        </div>

        <!-- Notas -->
        <input x-model="notes" type="text" placeholder="Notas opcionales (sensaciones, ajustes...)"
               class="w-full bg-zinc-800 border border-zinc-700 rounded-xl px-3 py-2.5 text-sm text-zinc-100 placeholder-zinc-600 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
               @keydown.enter="saveSet()" />

        <!-- Error -->
        <p x-show="error" x-text="error" class="text-rose-400 text-xs" x-cloak></p>

        <!-- Guardar -->
        <button @click="saveSet()" :disabled="loading || advancing"
                class="w-full py-3.5 rounded-xl font-bold text-sm transition-all active:scale-[0.98] disabled:opacity-50"
                :class="advancing ? 'bg-emerald-700 text-white' : saveSuccess ? 'bg-emerald-600 text-white' : isCircuitExercise ? 'bg-amber-600 hover:bg-amber-500 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'"
                x-text="saveButtonLabel">
        </button>
      </div>

      <!-- Timer (oculto en ejercicios intermedios del circuito) -->
      <div x-show="showTimer" class="bg-zinc-900 rounded-2xl p-4 border border-zinc-800"
           :class="targetMet ? 'border-emerald-900/50' : 'border-zinc-800'">
        <div class="flex items-center justify-between mb-3">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-widest"
                  :class="targetMet ? 'text-emerald-500' : 'text-zinc-500'"
                  x-text="isLastInCircuit && targetMet && !_pendingCircuitLoop
                          ? '🔄 SIGUIENTE RONDA EN...'
                          : targetMet ? '⏭ SIGUIENTE EN...' : 'DESCANSO'"></span>
            <!-- Normal: mostrar nombre del siguiente ejercicio -->
            <template x-if="targetMet && !isLastExercise && !isLastInCircuit">
              <p class="text-[11px] text-zinc-400 mt-0.5"
                 x-text="plan?.exercises?.[currentExIdx + 1]?.name"></p>
            </template>
            <!-- Circuito: mostrar primer ejercicio de la siguiente ronda -->
            <template x-if="targetMet && isLastInCircuit && circuitRound < currentExercise?.circuit_rounds">
              <p class="text-[11px] text-amber-400 mt-0.5"
                 x-text="'→ ' + circuitExercisesFromPlan[0]?.name"></p>
            </template>
            <template x-if="targetMet && isLastExercise && !isLastInCircuit">
              <p class="text-[11px] text-emerald-500 mt-0.5">Último ejercicio completado</p>
            </template>
          </div>
          <div class="flex items-center gap-2">
            <button @click="adjustTimer(-30)"
                    class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-500 text-sm hover:bg-zinc-700">−</button>
            <span class="text-[11px] text-zinc-500 font-mono w-10 text-center" x-text="fmtSecs(timerSeconds)"></span>
            <button @click="adjustTimer(30)"
                    class="w-6 h-6 rounded-full bg-zinc-800 text-zinc-500 text-sm hover:bg-zinc-700">+</button>
          </div>
        </div>
        <div class="text-center">
          <div class="text-5xl font-mono font-bold tracking-tight transition-colors duration-500"
               :class="timerDone ? 'text-emerald-400' : timerActive ? 'text-indigo-400' : 'text-zinc-700'"
               x-text="timerDisplay"></div>
        </div>
        <div class="mt-3 h-1 bg-zinc-800 rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all duration-1000 ease-linear"
               :class="timerDone ? 'bg-emerald-500' : 'bg-indigo-600'"
               :style="`width: ${timerProgress}%`"></div>
        </div>
        <div class="flex gap-2 mt-3">
          <button @click="timerActive ? stopTimer() : startTimer()"
                  class="flex-1 py-2 rounded-xl text-xs font-semibold transition-all active:scale-95"
                  :class="timerActive ? 'bg-zinc-800 text-zinc-300' : 'bg-indigo-600 text-white hover:bg-indigo-500'"
                  x-text="timerActive ? '⏹ Pausar' : (timerDone ? '🔄 Repetir' : '▶ Iniciar')">
          </button>
          <button @click="resetTimer()" class="px-3 py-2 rounded-xl bg-zinc-800 text-zinc-500 text-xs hover:bg-zinc-700">↺</button>
        </div>
      </div>

      <!-- Sets del ejercicio actual (en circuito muestra todas las rondas) -->
      <div x-show="setsForCurrentEx.length > 0" class="bg-zinc-900 rounded-2xl p-3 border border-zinc-800">
        <p class="text-[10px] font-bold text-zinc-600 uppercase tracking-widest mb-2">
          <span x-text="isCircuitExercise ? 'Historial · ' : 'Series de '"></span>
          <span x-text="currentExercise?.name"></span>
        </p>
        <div class="space-y-1.5">
          <template x-for="(set, i) in setsForCurrentEx" :key="set.id">
            <div class="flex items-center gap-3 text-sm">
              <span class="text-[11px] text-zinc-700 font-mono w-5"
                    x-text="isCircuitExercise ? 'R'+(i+1) : 'S'+(i+1)"></span>
              <span class="flex-1 text-zinc-300">
                <span class="font-semibold" x-text="set.weight_kg === 0 ? 'PC' : set.weight_kg+'kg'"></span>
                <span class="text-zinc-600"> × </span>
                <span x-text="set.reps"></span>
              </span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-semibold" :class="rirBadgeColor(set.rir)"
                    x-text="set.rir !== null ? 'RIR '+set.rir : ''"></span>
            </div>
            <template x-if="set.notes">
              <p class="text-[11px] text-zinc-600 italic ml-8 -mt-1" x-text="set.notes"></p>
            </template>
          </template>
        </div>
      </div>

      <!-- Saltar ejercicio (siempre disponible para emergencias) -->
      <template x-if="!isLastExercise">
        <button @click="skipExercise()"
                class="w-full py-2 rounded-xl text-xs text-zinc-700 hover:text-zinc-500 transition-colors">
          Saltar este ejercicio →
        </button>
      </template>

    </div>
  </div>

  <script>
    (function () {
      if (!new URLSearchParams(window.location.search).get('token'))
        document.getElementById('no-token').classList.remove('hidden');
    })();

    function workoutApp() {
      return {
        // ── Auth & perfil ───────────────────────────
        token: new URLSearchParams(window.location.search).get('token') || '',
        userName: '',
        goal: '',

        // ── Plan y estado de sesión ─────────────────
        plan: null,
        currentExIdx: 0,
        session: [],
        sessionComplete: false,
        sessionWasAlreadyDone: false,

        // ── Formulario de serie ─────────────────────
        weight: '',
        reps: '',
        rir: 2,
        notes: '',

        // ── UI ─────────────────────────────────────
        loading: true,
        saveSuccess: false,
        advancing: false,
        error: '',

        // ── Progresión post-sesión ──────────────────
        progression: null,
        progressionLoading: false,
        progressionError: null,

        // ── Cronómetro ──────────────────────────────
        timerSeconds: 120,
        timerRemaining: 120,
        timerTotal: 120,
        timerActive: false,
        timerDone: false,
        _timerInterval: null,

        // ── Circuito ────────────────────────────────
        // [CONCEPTO: máquina de estados para circuitos]
        // circuitRound: ronda actual (1-based). Se calcula desde los datos de sesión
        // al entrar al primer ejercicio del circuito, lo que hace el resume automático.
        // circuitCompletedSets: baseline de sets por ejercicio antes de esta ronda.
        // _pendingCircuitLoop: flag que le dice al callback del timer que, al expirar,
        // debe volver al primer ejercicio del circuito (no avanzar al siguiente).
        circuitRound: 1,
        circuitCompletedSets: {},
        _pendingCircuitLoop: false,

        // ── Computed ────────────────────────────────

        get currentExercise() {
          return this.plan?.exercises?.[this.currentExIdx] ?? null;
        },

        get isLastExercise() {
          return this.currentExIdx >= (this.plan?.exercises?.length ?? 0) - 1;
        },

        get isCircuitExercise() {
          return !!this.currentExercise?.is_circuit;
        },

        get isLastInCircuit() {
          const ex = this.currentExercise;
          return !!ex?.is_circuit && ex.circuit_position === ex.circuit_size - 1;
        },

        // Índice del primer ejercicio del bloque circuito actual
        get circuitFirstIdx() {
          const ex = this.currentExercise;
          if (!ex?.is_circuit) return this.currentExIdx;
          return this.currentExIdx - ex.circuit_position;
        },

        get circuitExercisesFromPlan() {
          return (this.plan?.exercises || []).filter(e => e.is_circuit);
        },

        // El timer solo se muestra en ejercicios normales y en el último del circuito
        get showTimer() {
          const ex = this.currentExercise;
          if (!ex) return false;
          if (ex.is_circuit && !this.isLastInCircuit) return false;
          return true;
        },

        // Normaliza un nombre de ejercicio para comparar (sin acentos, minúsculas).
        _normalizeName(name) {
          return (name || '')
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
            .toLowerCase()
            .trim();
        },

        // Compara dos nombres de ejercicio de forma tolerante a variaciones menores
        // (ej: la rutina se regeneró a mitad del día y "Fondos en paralelas" pasó a
        // llamarse "Fondos en paralelas con banda"). Sin esto, una serie ya guardada
        // hoy deja de "contar" para el plan actualizado y la app vuelve a pedir el
        // ejercicio como si no se hubiera completado la sesión.
        _namesMatch(a, b) {
          const na = this._normalizeName(a);
          const nb = this._normalizeName(b);
          if (!na || !nb) return false;
          if (na === nb) return true;
          const [shorter, longer] = na.length <= nb.length ? [na, nb] : [nb, na];
          if (!longer.startsWith(shorter)) return false;
          const nextChar = longer[shorter.length];
          return nextChar === ' ' || nextChar === '(';
        },

        _setsFor(exerciseName) {
          return this.session.filter(s => this._namesMatch(s.exercise, exerciseName));
        },

        get setsForCurrentEx() {
          const name = this.currentExercise?.name;
          if (!name) return [];
          return this._setsFor(name);
        },

        get setsCompleted() {
          return this.setsForCurrentEx.length;
        },

        get targetMet() {
          const ex = this.currentExercise;
          if (!ex) return false;
          if (ex.is_circuit) {
            // En circuito: objetivo = 1 set en esta ronda (baseline marca el inicio)
            const baseline = this.circuitCompletedSets[ex.name] ?? 0;
            return this._setsFor(ex.name).length - baseline >= 1;
          }
          return this.setsCompleted >= (ex.target_sets ?? 99);
        },

        get sessionGrouped() {
          const map = {};
          for (const set of this.session) {
            if (!map[set.exercise]) map[set.exercise] = { exercise: set.exercise, sets: [] };
            map[set.exercise].sets.push(set);
          }
          return Object.values(map);
        },

        get timerDisplay() {
          const m = Math.floor(this.timerRemaining / 60);
          const s = this.timerRemaining % 60;
          return `${m}:${String(s).padStart(2, '0')}`;
        },

        get timerProgress() {
          if (!this.timerTotal) return 0;
          return ((this.timerTotal - this.timerRemaining) / this.timerTotal) * 100;
        },

        get saveButtonLabel() {
          if (this.advancing) return this._pendingCircuitLoop ? '⏭ Descansando...' : '⏭ Siguiente ejercicio...';
          if (this.saveSuccess) return '✅ Serie guardada';
          if (this.loading) return 'Guardando...';
          const ex = this.currentExercise;
          if (!ex) return '💾 Guardar Serie';
          if (ex.is_circuit) {
            if (!this.isLastInCircuit) return '💾 Guardar → siguiente';
            if (this.circuitRound < ex.circuit_rounds) return `💾 Guardar · Descanso ${ex.circuit_rest}s`;
            return '💾 Finalizar circuito';
          }
          return '💾 Guardar Serie';
        },

        // ── Init ────────────────────────────────────

        async init() {
          if (!this.token) return;
          await Promise.all([this.fetchProfile(), this.fetchPlan(), this.fetchSession()]);
          this.loading = false;
          if (this.plan && !this.plan.is_rest_day) {
            this._resumeSession();
          }
        },

        async fetchProfile() {
          try {
            const res = await fetch(`/api/session/me?token=${this.token}`);
            if (res.ok) {
              const d = await res.json();
              this.userName = d.name || '';
              this.goal = d.goal || '';
            }
          } catch (_) {}
        },

        async fetchPlan() {
          try {
            const res = await fetch(`/api/session/plan?token=${this.token}`);
            this.plan = res.ok ? await res.json() : null;
          } catch (_) { this.plan = null; }
        },

        async fetchSession() {
          try {
            const res = await fetch(`/api/session/today?token=${this.token}`);
            this.session = res.ok ? await res.json() : [];
          } catch (_) { this.session = []; }
        },

        // ── Reanudar sesión al recargar ──────────────

        _resumeSession() {
          const exercises = this.plan?.exercises;
          if (!exercises?.length) return;

          const circuitExs = exercises.filter(e => e.is_circuit);

          // Si hay circuito: verificar si está en progreso
          if (circuitExs.length > 0) {
            const circuitRounds = circuitExs[0].circuit_rounds;
            const minLogged = Math.min(
              ...circuitExs.map(e => this._setsFor(e.name).length)
            );
            if (minLogged < circuitRounds) {
              // Circuito incompleto: encontrar punto de reanudación
              const firstCircuitIdx = exercises.findIndex(e => e.is_circuit);
              this.circuitRound = minLogged + 1;
              const baseline = {};
              circuitExs.forEach(e => { baseline[e.name] = minLogged; });
              this.circuitCompletedSets = baseline;

              for (let i = 0; i < circuitExs.length; i++) {
                const logged = this._setsFor(circuitExs[i].name).length;
                if (logged <= minLogged) {
                  this._loadExercise(firstCircuitIdx + i);
                  return;
                }
              }
              this._loadExercise(firstCircuitIdx);
              return;
            }
          }

          // Buscar primer ejercicio no completado (normal o circuito ya terminado)
          for (let i = 0; i < exercises.length; i++) {
            const ex = exercises[i];
            if (ex.is_circuit) continue;  // el circuito se maneja arriba
            const logged = this._setsFor(ex.name).length;
            if (logged < ex.target_sets) {
              this._loadExercise(i);
              return;
            }
          }

          this.sessionComplete = true;
          this.sessionWasAlreadyDone = true;
        },

        // ── Cargar ejercicio ─────────────────────────

        _loadExercise(idx) {
          this.currentExIdx = idx;
          const ex = this.plan?.exercises?.[idx];
          if (!ex) return;

          // Al entrar al primer ejercicio de un circuito: inicializar estado de ronda
          // desde los datos de sesión (robusto a recargas de página)
          if (ex.is_circuit && ex.circuit_position === 0) {
            const circuitExs = this.plan.exercises.filter(e => e.is_circuit);
            const minLogged = Math.min(
              ...circuitExs.map(e => this._setsFor(e.name).length)
            );
            this.circuitRound = minLogged + 1;
            const baseline = {};
            circuitExs.forEach(e => { baseline[e.name] = minLogged; });
            this.circuitCompletedSets = baseline;
          }

          this.weight = ex.suggested_weight > 0 ? String(ex.suggested_weight) : '';
          // Pre-cargar reps desde sugerencia del agente si existe, si no desde rutina
          if (ex.suggested_reps) {
            const nums = ex.suggested_reps.match(/\d+/g);
            this.reps = nums ? String(nums[nums.length - 1]) : (ex.reps_max ? String(ex.reps_max) : '');
          } else {
            this.reps = ex.reps_max ? String(ex.reps_max) : '';
          }
          this.rir    = 2;
          this.notes  = '';
          this.error  = '';

          const rest = (ex.suggested_rest > 0) ? ex.suggested_rest : 120;
          this.timerSeconds   = rest;
          this.timerRemaining = rest;
          this.timerTotal     = rest;
          this.timerActive    = false;
          this.timerDone      = false;
          this._pendingCircuitLoop = false;
          clearInterval(this._timerInterval);
        },

        // ── Guardar serie ────────────────────────────

        async saveSet() {
          if (!this.reps || parseInt(this.reps) < 1) {
            this.error = 'Indica cuántas repeticiones hiciste';
            return;
          }
          const exercise = this.currentExercise?.name;
          if (!exercise) { this.error = 'No hay ejercicio seleccionado'; return; }

          this.loading = true;
          this.error = '';
          try {
            const res = await fetch('/api/session/set', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                token: this.token,
                exercise,
                reps: parseInt(this.reps),
                weight_kg: parseFloat(this.weight) || 0,
                rir: this.rir,
                notes: this.notes.trim() || null,
              }),
            });
            if (!res.ok) throw new Error((await res.json()).detail || 'Error');
            const saved = await res.json();
            this.session.push(saved);

            if (this.currentExercise) {
              this.currentExercise.suggested_weight = parseFloat(this.weight) || 0;
            }

            this.notes = '';
            this.rir   = 2;
            this.saveSuccess = true;

            const ex = this.currentExercise;

            if (ex.is_circuit) {
              const baseline = this.circuitCompletedSets[exercise] ?? 0;
              const totalLogged = this._setsFor(exercise).length;
              const isRoundDone = (totalLogged - baseline) >= 1;

              if (!isRoundDone) {
                // Raro: no debería pasar, pero safety
                setTimeout(() => { this.saveSuccess = false; }, 1800);
              } else if (!this.isLastInCircuit) {
                // Avanzar al siguiente ejercicio del circuito inmediatamente
                setTimeout(() => {
                  this.saveSuccess = false;
                  this._loadExercise(this.currentExIdx + 1);
                }, 600);
              } else {
                // Último ejercicio de la ronda
                const currentRound = baseline + 1;  // rondas completadas antes + 1
                if (currentRound < ex.circuit_rounds) {
                  // Hay más rondas: arrancar timer de descanso, luego volver al inicio
                  this._pendingCircuitLoop = true;
                  this.startTimer();
                } else {
                  // Circuito terminado
                  if (this.isLastExercise) {
                    setTimeout(() => this.finishSession(), 1500);
                  } else {
                    setTimeout(() => {
                      this.saveSuccess = false;
                      this._loadExercise(this.currentExIdx + 1);
                    }, 1500);
                  }
                }
              }
            } else {
              // Ejercicio normal: lógica existente
              const newCount = this._setsFor(exercise).length;
              const target   = ex.target_sets ?? 99;
              if (newCount >= target && this.isLastExercise) {
                setTimeout(() => this.finishSession(), 1500);
              } else {
                setTimeout(() => { this.saveSuccess = false; }, 1800);
                this.startTimer();
              }
            }

          } catch (e) {
            this.error = e.message || '❌ Error al guardar. Intenta de nuevo.';
          } finally {
            this.loading = false;
          }
        },

        // ── Navegar ejercicios ───────────────────────

        nextExercise() {
          if (this.isLastExercise) {
            this.finishSession();
            return;
          }
          this._loadExercise(this.currentExIdx + 1);
        },

        skipExercise() {
          if (!this.isLastExercise) this._loadExercise(this.currentExIdx + 1);
          else this.finishSession();
        },

        finishSession() {
          clearInterval(this._timerInterval);
          this.sessionComplete = true;
          // Calcular progresión solo cuando se acaba de completar (no al recargar)
          if (!this.sessionWasAlreadyDone) {
            this.fetchProgression();
          }
        },

        async fetchProgression() {
          this.progressionLoading = true;
          this.progressionError = null;
          try {
            const res = await fetch(`/api/session/finish?token=${this.token}`, {
              method: 'POST',
            });
            if (!res.ok) throw new Error('Error al calcular progresión');
            const data = await res.json();
            if (data.error) {
              this.progressionError = 'No se pudo calcular la progresión';
            } else {
              this.progression = data.suggestions || [];
            }
          } catch (_) {
            this.progressionError = 'No se pudo calcular la progresión';
          } finally {
            this.progressionLoading = false;
          }
        },

        // ── Cronómetro ───────────────────────────────

        startTimer() {
          this.timerTotal     = this.timerSeconds;
          this.timerRemaining = this.timerSeconds;
          this.timerActive    = true;
          this.timerDone      = false;
          clearInterval(this._timerInterval);
          this._timerInterval = setInterval(() => {
            if (this.timerRemaining > 0) {
              this.timerRemaining--;
            } else {
              this.timerActive = false;
              this.timerDone   = true;
              clearInterval(this._timerInterval);
              this.playBeep();

              if (this._pendingCircuitLoop) {
                // Timer entre rondas: volver al primer ejercicio del circuito
                this._pendingCircuitLoop = false;
                this.advancing = true;
                const firstIdx = this.circuitFirstIdx;
                setTimeout(() => {
                  this.advancing = false;
                  this._loadExercise(firstIdx);
                }, 800);
              } else if (this.targetMet) {
                // Timer post-serie: avanzar al siguiente ejercicio
                this.advancing = true;
                setTimeout(() => {
                  this.advancing = false;
                  if (this.isLastExercise) this.finishSession();
                  else this.nextExercise();
                }, 800);
              }
            }
          }, 1000);
        },

        stopTimer() { clearInterval(this._timerInterval); this.timerActive = false; },

        resetTimer() {
          clearInterval(this._timerInterval);
          this.timerActive    = false;
          this.timerDone      = false;
          this.timerTotal     = this.timerSeconds;
          this.timerRemaining = this.timerSeconds;
        },

        adjustTimer(delta) {
          this.timerSeconds = Math.max(30, Math.min(600, this.timerSeconds + delta));
          if (!this.timerActive) {
            this.timerTotal     = this.timerSeconds;
            this.timerRemaining = this.timerSeconds;
          }
        },

        fmtSecs(s) {
          return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
        },

        playBeep() {
          try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            [0, 0.35, 0.7].forEach(offset => {
              const osc = ctx.createOscillator(), gain = ctx.createGain();
              osc.connect(gain); gain.connect(ctx.destination);
              osc.frequency.value = 880; osc.type = 'sine';
              gain.gain.setValueAtTime(0.25, ctx.currentTime + offset);
              gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + offset + 0.3);
              osc.start(ctx.currentTime + offset);
              osc.stop(ctx.currentTime + offset + 0.35);
            });
          } catch (_) {}
        },

        // ── Helpers UI ───────────────────────────────

        rirLabel(n) {
          return ['Fallo (RPE 10)', '1 rep en recámara (RPE 9)', '2 reps (RPE 8)',
                  '3 reps (RPE 7)', '4 reps', '5+ reps (fácil)'][n] || '';
        },

        rirActiveColor(n) {
          return ['bg-rose-600 text-white', 'bg-orange-500 text-white',
                  'bg-amber-400 text-zinc-900', 'bg-yellow-300 text-zinc-900',
                  'bg-emerald-500 text-white', 'bg-emerald-700 text-white'][n] || 'bg-zinc-700';
        },

        rirBadgeColor(n) {
          if (n === null || n === undefined) return '';
          return ['bg-rose-950 text-rose-400', 'bg-orange-950 text-orange-400',
                  'bg-amber-950 text-amber-400', 'bg-yellow-950 text-yellow-400',
                  'bg-emerald-950 text-emerald-400', 'bg-emerald-950 text-emerald-500'][n] || 'bg-zinc-800 text-zinc-500';
        },

        todayDate() {
          return new Date().toLocaleDateString('es-ES', {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
        },
      };
    }
  </script>
